<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scriptorium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cinzel:wght@400;500;600&family=Amiri:ital,wght@0,400;0,700;1,400&family=Reem+Kufi:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --umber:#1C140C;
  --umber-2:#2A1E12;
  --wood:#3A2A18;
  --lapis:#1F3A6E;
  --verdigris:#4A6B4A;
  --vermilion:#C1352B;
  --gold:#C9A227;
  --gold-soft:#E0C56A;
  --gold-dim:rgba(201,162,39,.34);
  --parch:#EFE4CA;
  --parch-mute:#BFAE8C;
  --vellum:#EDE2C6;
  --iron:#2A2118;
  --rule:rgba(201,162,39,.22);
  --rule-soft:rgba(201,162,39,.12);
  --book:"EB Garamond",Georgia,serif;
  --blackletter:"UnifrakturMaguntia","EB Garamond",serif;
  --carved:"Cinzel","EB Garamond",serif;
  --naskh:"Amiri","Times New Roman",serif;
  --kufi:"Reem Kufi","Noto Kufi Arabic",sans-serif;
  --display:var(--blackletter);
  --read:var(--book);
  --label:var(--carved);
}
html[lang="ar"]{ --display:var(--kufi); --read:var(--naskh); --label:var(--kufi); }

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--umber);
  color:var(--parch);
  font-family:var(--read);
  font-size:17px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}

/* ============ painted background ============ */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg svg{display:block}
.miniature{position:absolute;inset:0;width:100%;height:100%;opacity:.34}
.painting{position:absolute;inset:0;background-size:cover;background-position:center;
  opacity:0;filter:sepia(.55) saturate(.75) contrast(.95)}
.vine{position:absolute;top:0;height:100%;width:118px;opacity:.42}
.vine-l{inset-inline-start:0}
.vine-r{inset-inline-end:0;transform:scaleX(-1)}
@media(max-width:1180px){.vine{display:none}}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(ellipse at 50% 38%,rgba(28,20,12,.12) 0%,rgba(28,20,12,.74) 62%,rgba(18,12,6,.94) 100%),
    linear-gradient(180deg,rgba(18,12,6,.55),transparent 22%,transparent 72%,rgba(18,12,6,.75))}
.wrap{position:relative;z-index:2}

img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
a{color:var(--gold-soft);text-decoration:none}
a:hover{color:var(--vermilion)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
::selection{background:var(--gold);color:var(--umber)}

/* ============ top bar ============ */
.topbar{border-bottom:1px solid var(--rule);background:rgba(20,14,8,.84);
  position:sticky;top:0;z-index:20;backdrop-filter:blur(2px)}
.topbar-in{max-width:1220px;margin:0 auto;padding:.5rem 20px;display:flex;align-items:center;
  gap:1rem;flex-wrap:wrap;justify-content:space-between}
.panels{display:flex;gap:.4rem}
.ptab{font-family:var(--label);font-size:.82rem;letter-spacing:.04em;color:var(--parch-mute);
  border:1px solid var(--rule);padding:.32rem .85rem;white-space:nowrap}
.ptab:hover{color:var(--gold-soft);border-color:var(--gold-dim)}
.ptab[aria-pressed="true"]{color:var(--umber);background:var(--gold);border-color:var(--gold)}
.topbar-right{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap}
.lang{display:flex;border:1px solid var(--rule)}
.lang button{font-family:var(--label);font-size:.8rem;padding:.28rem .62rem;color:var(--parch-mute)}
.lang button[aria-pressed="true"]{background:rgba(201,162,39,.16);color:var(--gold-soft)}
.lang button:hover{color:var(--gold)}
.tally{font-family:var(--label);font-size:.74rem;color:var(--parch-mute);letter-spacing:.04em}
@media(max-width:640px){.tally{display:none}}

/* ============ shell ============ */
.shell{max-width:1220px;margin:0 auto;padding:0 20px}
@media(min-width:980px){
  .shell{display:grid;grid-template-columns:20rem minmax(0,1fr);align-items:start}
  .rail{position:sticky;top:50px;max-height:calc(100vh - 50px);overflow-y:auto;
    padding:36px 32px 40px 0;border-inline-end:1px solid var(--rule)}
  .main{padding:36px 0 110px;padding-inline-start:40px;min-width:0}
}
@media(max-width:979px){
  .rail{padding:26px 0 22px;border-bottom:1px solid var(--rule)}
  .main{padding:24px 0 80px}
}
.rail::-webkit-scrollbar{width:5px}
.rail::-webkit-scrollbar-thumb{background:var(--gold-dim)}

/* ============ masthead ============ */
.brand{display:block}
.title{font-family:var(--display);font-weight:400;font-size:3rem;line-height:1.02;
  margin:0 0 .4rem;color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.45)}
html[lang="ar"] .title{font-size:2.3rem;line-height:1.4;font-weight:600}
.tagline{font-size:1.05rem;line-height:1.5;color:var(--parch);margin:0 0 .9rem;max-width:30ch}
.tally-line{font-family:var(--label);font-size:.74rem;color:var(--parch-mute);letter-spacing:.05em;
  margin:0 0 1.2rem;border-block:1px solid var(--rule);padding:.4rem 0}
.byline{font-family:var(--label);font-size:.8rem;color:var(--parch-mute);margin:0 0 1rem}
.byline b{color:var(--gold-soft);font-weight:500}
.bio{font-size:.98rem;line-height:1.6;color:var(--parch-mute);margin:0 0 1.2rem;max-width:34ch}

.nav{list-style:none;margin:0 0 1.4rem;padding:0}
.nav li{border-bottom:1px dotted var(--rule)}
.nav a{display:block;padding:.42rem 0;font-family:var(--label);font-size:.92rem;letter-spacing:.03em;color:var(--parch)}
.nav a::before{content:"\276F  ";color:var(--gold-dim)}
.nav a:hover{color:var(--gold-soft)}
.nav a[aria-current="page"]{color:var(--gold)}
.nav a[aria-current="page"]::before{color:var(--gold)}

.rail-block{border-top:1px solid var(--gold-dim);padding-top:1rem;margin-top:1.3rem}
.rail-h{font-family:var(--display);font-size:1.5rem;font-weight:400;color:var(--gold);margin:0 0 .5rem;line-height:1.1}
html[lang="ar"] .rail-h{font-size:1.1rem;font-weight:600;line-height:1.5}
.rail-p{font-size:.95rem;color:var(--parch-mute);margin:0 0 .7rem;line-height:1.55}
.social{display:flex;flex-wrap:wrap;gap:.35rem}
.social a{font-family:var(--label);font-size:.75rem;border:1px solid var(--rule);padding:.15rem .55rem;color:var(--parch)}
.social a:hover{border-color:var(--gold);color:var(--gold-soft)}

/* ============ forms ============ */
.field{width:100%;background:rgba(239,228,202,.07);border:1px solid var(--rule);
  padding:.5rem .65rem;font-family:var(--read);font-size:1rem;color:var(--parch)}
.field::placeholder{color:rgba(191,174,140,.6)}
.field:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.14)}
select.field{appearance:none}
option{background:var(--umber-2);color:var(--parch)}
textarea.field{min-height:5rem;resize:vertical;line-height:1.65}
textarea.body-field{min-height:20rem;font-size:1rem}
label.lab{display:block;font-family:var(--label);font-size:.76rem;letter-spacing:.05em;
  color:var(--parch-mute);margin:0 0 .3rem}
.hint{font-size:.9rem;color:var(--parch-mute);margin:.35rem 0 0;line-height:1.5;opacity:.88}
.row{display:flex;gap:.55rem;flex-wrap:wrap}
.row>*{flex:1 1 12rem}
.stack{display:grid;gap:.95rem}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.btn{border:1px solid var(--gold-dim);color:var(--gold-soft);padding:.45rem .95rem;
  font-family:var(--label);font-size:.86rem;letter-spacing:.03em}
.btn:hover{background:rgba(201,162,39,.12);border-color:var(--gold)}
.btn.solid{background:var(--gold);color:var(--umber);border-color:var(--gold)}
.btn.solid:hover{background:var(--gold-soft)}
.btn.warn{border-color:rgba(193,53,43,.5);color:#E08078}
.btn.warn:hover{background:rgba(193,53,43,.16);border-color:var(--vermilion)}
.btn.sm{padding:.25rem .6rem;font-size:.78rem}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ============ feed ============ */
.feedbar{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;flex-wrap:wrap;
  border-bottom:1px solid var(--gold-dim);padding-bottom:.6rem;margin-bottom:1.7rem}
.feedbar h2{font-family:var(--display);font-size:2rem;font-weight:400;color:var(--gold);margin:0;line-height:1.05}
html[lang="ar"] .feedbar h2{font-size:1.45rem;font-weight:600;line-height:1.5}
.feedbar .count{font-family:var(--label);font-size:.76rem;color:var(--parch-mute)}
.search{max-width:14rem}

.entry{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 1.1rem;
  padding-bottom:2rem;margin-bottom:2rem;border-bottom:1px solid var(--rule-soft)}
.entry:last-of-type{border-bottom:0}
.versal{font-family:var(--display);font-size:2.3rem;line-height:1;color:var(--gold);
  width:2.7rem;height:2.7rem;display:grid;place-items:center;
  border:1px solid var(--gold-dim);background:rgba(201,162,39,.08)}
html[lang="ar"] .versal{font-family:var(--kufi);font-size:1.45rem;font-weight:600}
.entry-body{min-width:0}
.meta{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;font-family:var(--label);
  font-size:.74rem;letter-spacing:.05em;color:var(--parch-mute);margin:0 0 .5rem}
.meta .kind{color:var(--gold-soft)}
.meta .draft-flag{color:var(--vermilion)}
.mark{color:var(--gold)}
.entry h3{font-family:var(--read);font-weight:600;font-size:1.6rem;line-height:1.2;
  margin:0 0 .5rem;color:var(--parch);max-width:28ch}
.entry h3 a{color:inherit}
.entry h3 a:hover{color:var(--gold-soft)}
.excerpt{font-size:1.05rem;line-height:1.62;color:var(--parch-mute);margin:0 0 .85rem;max-width:62ch}
.tags{display:flex;gap:.35rem;flex-wrap:wrap;margin:.7rem 0 0}
.tag{font-family:var(--label);font-size:.72rem;letter-spacing:.04em;color:var(--parch-mute);
  border:1px solid var(--rule-soft);padding:.1rem .5rem}
.tag:hover{color:var(--gold-soft);border-color:var(--gold-dim)}
@media(max-width:560px){.entry{grid-template-columns:1fr}.versal{margin-bottom:.7rem}}

.band{border:1px solid var(--gold-dim);margin:0 0 .9rem;background:var(--umber-2)}
.band img{width:100%;aspect-ratio:16/9;object-fit:cover}
.gallery{display:grid;gap:4px;grid-template-columns:repeat(2,1fr);margin:0 0 .9rem}
.gallery.n1{grid-template-columns:1fr}
.gallery.n3 :first-child{grid-column:1/-1}
.gallery img{width:100%;height:100%;aspect-ratio:4/3;object-fit:cover;cursor:zoom-in;
  background:var(--umber-2);border:1px solid var(--gold-dim)}
.gallery img:hover{border-color:var(--gold)}
.embed{position:relative;aspect-ratio:16/9;background:#0d0a06;border:1px solid var(--gold-dim);
  overflow:hidden;margin:0 0 .9rem}
.embed iframe,.embed video{position:absolute;inset:0;width:100%;height:100%;border:0}

/* ============ the vellum leaf ============ */
.leaf{position:relative;background:var(--vellum);color:var(--iron);max-width:70ch;
  padding:clamp(1.7rem,4vw,3.2rem) clamp(1.5rem,4vw,3.4rem);
  border:1px solid rgba(122,92,30,.5);
  background-image:radial-gradient(ellipse at 18% 0%,rgba(255,252,240,.75),transparent 58%),
    radial-gradient(ellipse at 88% 100%,rgba(150,124,74,.3),transparent 52%);
  box-shadow:0 22px 60px rgba(0,0,0,.6)}
.leaf::before{content:"";position:absolute;inset-inline-start:0;inset-block:0;width:4px;
  background:linear-gradient(var(--gold),rgba(201,162,39,.2))}
.leaf .meta{color:#6B5A38;border-bottom:1px solid rgba(42,33,24,.2);padding-bottom:.6rem}
.leaf .meta .kind{color:var(--vermilion)}
.leaf .meta a{color:#6B5A38}
.leaf .meta a:hover{color:var(--vermilion)}
.leaf h1{font-family:var(--read);font-weight:600;font-size:clamp(1.9rem,4.2vw,2.7rem);
  line-height:1.14;margin:.7rem 0 .2rem;color:var(--iron)}
.leaf .rubric{font-family:var(--label);font-size:.74rem;letter-spacing:.1em;color:var(--vermilion);margin:0 0 1.4rem}
.prose{font-size:1.18rem;line-height:1.78}
.prose p{margin:0 0 1.15rem}
.prose>p:first-of-type::first-letter{font-family:var(--blackletter);font-size:3.4em;
  line-height:.82;float:left;margin:.05em .1em 0 0;color:var(--vermilion)}
.prose h2{font-weight:600;font-size:1.5rem;margin:2rem 0 .6rem;color:#3D2F18}
.prose h3{font-weight:600;font-size:1.2rem;margin:1.6rem 0 .4rem;color:#3D2F18}
.prose ul,.prose ol{margin:0 0 1.15rem;padding-inline-start:1.4rem}
.prose li{margin:0 0 .35rem}
.prose li::marker{color:var(--vermilion)}
.prose blockquote{margin:1.5rem 0;padding-inline-start:1.1rem;
  border-inline-start:2px solid var(--vermilion);font-style:italic;color:#4A3C22}
.prose blockquote p:last-child{margin:0}
.prose a{color:#7A5C1E;border-bottom:1px solid rgba(122,92,30,.45)}
.prose a:hover{color:var(--vermilion);border-bottom-color:var(--vermilion)}
.prose code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.84em;
  background:rgba(42,33,24,.08);border:1px solid rgba(42,33,24,.16);padding:.05em .3em}
.prose pre{background:#241C12;color:var(--parch);padding:.9rem 1rem;overflow-x:auto}
.prose pre code{background:none;border:0;color:inherit;font-size:.85rem}
.prose hr{border:0;border-top:1px solid rgba(42,33,24,.25);margin:2rem 0}
.prose figure{margin:1.6rem 0}
.prose figure img{border:1px solid rgba(42,33,24,.3)}
.prose figcaption{font-family:var(--label);font-size:.76rem;color:#6B5A38;margin-top:.4rem}
.colophon{max-width:70ch;font-family:var(--label);font-size:.74rem;letter-spacing:.05em;
  color:var(--parch-mute);margin:.7rem 0 0;text-align:end}

/* ---- direction follows the TEXT, not the interface ---- */
.rtl-text{font-family:var(--naskh);line-height:2.05}
.rtl-text h1,.rtl-text h2,.rtl-text h3{font-family:var(--naskh);line-height:1.6}
.rubric.rtl-text,.colophon.rtl-text{letter-spacing:0}
/* Arabic is cursive: a floated initial would tear the first word apart.
   An illuminated ornament does the same job without breaking the script. */
.prose.rtl-text>p:first-of-type::first-letter{font-family:inherit;font-size:1em;line-height:inherit;
  float:none;margin:0;color:inherit}
.prose.rtl-text>p:first-of-type::before{content:"\06DE  ";color:var(--gold);font-size:1.25em;line-height:1}
.prose.rtl-text blockquote{font-style:normal}
.entry-body.rtl-text h3,.entry-body.rtl-text .excerpt{font-family:var(--naskh);line-height:1.9}

/* ============ share ============ */
.share{max-width:70ch;margin-top:2.2rem;border-top:1px solid var(--gold-dim);padding-top:1rem}
.share h4{font-family:var(--display);font-size:1.45rem;font-weight:400;color:var(--gold);margin:0 0 .7rem}
html[lang="ar"] .share h4{font-family:var(--kufi);font-size:1.1rem;font-weight:600}
.share-row{display:flex;gap:.35rem;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:.3rem;font-family:var(--label);font-size:.8rem;
  letter-spacing:.03em;border:1px solid var(--rule);padding:.28rem .7rem;color:var(--parch)}
.chip:hover{border-color:var(--gold);color:var(--gold-soft)}

/* ============ subscribe ============ */
.sub-form{display:flex;gap:.35rem;flex-wrap:wrap}
.sub-form .field{flex:1 1 9rem;min-width:0}
.sub-ok{font-size:.96rem;color:var(--gold-soft);margin:.5rem 0 0;line-height:1.5}
.subscribe-wide{max-width:70ch;margin:2.2rem 0 0;border:1px solid var(--gold-dim);
  padding:1.4rem;background:rgba(42,30,18,.72)}
.subscribe-wide h3{font-family:var(--display);font-size:1.7rem;font-weight:400;color:var(--gold);
  margin:0 0 .4rem;line-height:1.1}
html[lang="ar"] .subscribe-wide h3{font-family:var(--kufi);font-size:1.25rem;font-weight:600;line-height:1.5}
.subscribe-wide p{color:var(--parch-mute);margin:0 0 .85rem;max-width:52ch}

/* ============ scriptorium ============ */
.scribe-head{border:1px solid var(--gold-dim);background:rgba(42,30,18,.72);padding:1.1rem 1.2rem;margin-bottom:1.6rem}
.scribe-head h2{font-family:var(--display);font-size:1.9rem;font-weight:400;color:var(--gold);margin:0 0 .2rem;line-height:1.05}
html[lang="ar"] .scribe-head h2{font-family:var(--kufi);font-size:1.4rem;font-weight:600;line-height:1.5}
.scribe-head p{color:var(--parch-mute);margin:0;max-width:60ch}
.panel-sec{border-top:1px solid var(--rule);padding-top:1.2rem;margin-top:1.9rem}
.panel-sec:first-of-type{border-top:0;margin-top:0;padding-top:0}
.panel-sec h2{font-family:var(--display);font-size:1.6rem;font-weight:400;color:var(--gold);margin:0 0 .3rem;line-height:1.08}
html[lang="ar"] .panel-sec h2{font-family:var(--kufi);font-size:1.25rem;font-weight:600;line-height:1.5}
.lead{color:var(--parch-mute);margin:0 0 1rem;max-width:60ch}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;
  padding:.55rem 0;border-bottom:1px dotted var(--rule)}
.list .grow{flex:1 1 12rem;min-width:0}
.list .ttl{display:block;font-size:1.05rem;color:var(--parch);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .sub{font-family:var(--label);font-size:.72rem;letter-spacing:.04em;color:var(--parch-mute)}
.stat-row{display:flex;gap:1.9rem;flex-wrap:wrap;margin:0 0 1.3rem}
.stat b{display:block;font-family:var(--display);font-size:2.2rem;font-weight:400;color:var(--gold);line-height:1}
html[lang="ar"] .stat b{font-family:var(--kufi);font-size:1.7rem;font-weight:600}
.stat span{font-family:var(--label);font-size:.72rem;letter-spacing:.05em;color:var(--parch-mute)}
.langtabs{display:flex;gap:.3rem;margin:0 0 .6rem}
.langtabs button{font-family:var(--label);font-size:.78rem;letter-spacing:.04em;
  border:1px solid var(--rule);padding:.22rem .65rem;color:var(--parch-mute)}
.langtabs button[aria-pressed="true"]{color:var(--gold);border-color:var(--gold-dim);background:rgba(201,162,39,.1)}

.dispatch{border:1px solid var(--gold-dim);padding:1rem 1.1rem;background:rgba(42,30,18,.6)}
.batch-row{display:flex;gap:.4rem;flex-wrap:wrap;margin:.8rem 0 0}
.steps{counter-reset:s;list-style:none;margin:0 0 1rem;padding:0}
.steps li{counter-increment:s;position:relative;padding-inline-start:2.1rem;margin:0 0 .6rem;
  color:var(--parch-mute);line-height:1.55}
.steps li::before{content:counter(s,upper-roman) ".";position:absolute;inset-inline-start:0;
  font-family:var(--label);color:var(--gold);font-size:.85rem}

/* ============ misc ============ */
.empty{border:1px solid var(--gold-dim);padding:1.9rem;max-width:46ch;background:rgba(42,30,18,.72)}
.empty h3{font-family:var(--display);font-size:1.7rem;font-weight:400;color:var(--gold);margin:0 0 .4rem;line-height:1.1}
html[lang="ar"] .empty h3{font-family:var(--kufi);font-size:1.25rem;font-weight:600;line-height:1.5}
.empty p{color:var(--parch-mute);margin:0 0 1rem}
.back{display:inline-block;font-family:var(--label);font-size:.8rem;letter-spacing:.04em;
  color:var(--parch-mute);margin:0 0 1rem}
.back:hover{color:var(--gold-soft)}
.warnbox{border:1px solid rgba(193,53,43,.45);background:rgba(193,53,43,.1);padding:.8rem .95rem;
  font-size:.98rem;line-height:1.55;color:#E8C9C4;margin:0 0 1.2rem;max-width:62ch}
.notebox{border:1px solid var(--gold-dim);background:rgba(201,162,39,.08);padding:.8rem .95rem;
  font-size:.98rem;line-height:1.55;color:var(--parch);margin:0 0 1.2rem;max-width:62ch}
.toast{position:fixed;inset-inline:0;bottom:22px;z-index:60;display:flex;justify-content:center;
  pointer-events:none;opacity:0;transition:opacity .18s ease}
.toast.on{opacity:1}
.toast span{background:var(--gold);color:var(--umber);font-family:var(--label);font-size:.84rem;
  padding:.45rem 1rem;box-shadow:0 6px 24px rgba(0,0,0,.6)}

/* ---------- 2. Storage ---------- */
var K_SITE = "scriptorium:site", K_SUBS = "scriptorium:subs", K_PREF = "scriptorium:pref";
var mem = {};
/* Where the library is kept, in order of preference:
     "claude" — window.storage, present only inside Claude's artifact viewer.
                Survives closing the tab and is shared with everyone who opens it.
     "local"  — the browser's own store, used once the file is downloaded or
                hosted. Survives closing the tab, but lives on this device only.
     "memory" — a plain variable. Survives nothing. Last resort when a page is
                sandboxed so tightly that even local storage is refused.           */
var STORE_MODE = "memory";
function detectStore(){
  if (typeof window !== "undefined" && window.storage) return "claude";
  try {
    var probe = "scriptorium:probe";
    window.localStorage.setItem(probe, "1");
    window.localStorage.removeItem(probe);
    return "local";
  } catch(e){ return "memory"; }
}
STORE_MODE = detectStore();

var store = {
  async get(k, shared){
    if (STORE_MODE === "claude") {
      try { var r = await window.storage.get(k, !!shared); return r ? JSON.parse(r.value) : null; }
      catch(e){ return null; }
    }
    if (STORE_MODE === "local") {
      try { var v = window.localStorage.getItem(k); return v ? JSON.parse(v) : null; }
      catch(e){ return null; }
    }
    return k in mem ? mem[k] : null;
  },
  async set(k, v, shared){
    if (STORE_MODE === "claude") {
      try { await window.storage.set(k, JSON.stringify(v), !!shared); return true; }
      catch(e){ toast(t("saveFailed")); return false; }
    }
    if (STORE_MODE === "local") {
      try { window.localStorage.setItem(k, JSON.stringify(v)); return true; }
      catch(e){ toast(t("saveFull")); return false; }
    }
    mem[k] = v; return true;
  }
};

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){

function safeUrl(u){

/* Which way does this text run?  Decided by the script of the characters
   themselves, never by the interface language — an Arabic article must read
   right-to-left even while the UI is in English. */
var RTL_RANGE = /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]/g;
function isRtl(txt){
  var str = String(txt||"");

}

function stripMd(x){
  return String(x||"").replace(/```[\s\S]*?```/g," ").replace(/!\[[^\]]*\]\([^)]*\)/g," ")
    .replace(/\[([^\]]*)\]\([^)]*\)/g,"$1").replace(/[#>*_`~-]/g," ").replace(/\s+/g," ").trim();
}

/* ---------- 4. Markdown-lite (escapes first) ---------- */
function inline(x){
  var codes=[];
  x = x.replace(/`([^`]+)`/g,function(_,c){ codes.push(c); return "\u0000"+(codes.length-1)+"\u0000"; });
  x = x.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,function(_,alt,u){
    var s=safeUrl(u); return s?'<img src="'+s+'" alt="'+alt+'">':alt; });
  x = x.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,function(_,txt,u){
    var s=safeUrl(u); return s?'<a href="'+s+'" target="_blank" rel="noopener noreferrer">'+txt+'</a>':txt; });
  x = x.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  x = x.replace(/(^|[\s(])\*([^*\n]+)\*/g,"$1<em>$2</em>");
  x = x.replace(/(^|[\s(])_([^_\n]+)_/g,"$1<em>$2</em>");
  x = x.replace(/~~([^~]+)~~/g,"<del>$1</del>");
  return x.replace(/\u0000(\d+)\u0000/g,function(_,i){ return "<code>"+codes[+i]+"</code>"; });
}
function md(src){ return blocks(String(src||"").replace(/\r\n?/g,"\n").split("\n").map(esc)); }
function blocks(ls){
  var out=[], i=0;
  var isBlock=function(l){
    return /^\s*$/.test(l) || /^#{1,4}\s/.test(l) || /^&gt;\s?/.test(l) || /^```/.test(l)
      || /^\s*([-*+]|\d+[.)])\s+/.test(l) || /^(---|\*\*\*|___)\s*$/.test(l);
  };
  while (i < ls.length) {
    var l = ls[i];
    if (/^\s*$/.test(l)) { i++; continue; }
    var h = l.match(/^(#{1,4})\s+(.*)$/);
    if (h) { var lv=Math.min(4,Math.max(2,h[1].length));
      out.push("<h"+lv+' dir="auto">'+inline(h[2])+"</h"+lv+">"); i++; continue; }
    if (/^(---|\*\*\*|___)\s*$/.test(l)) { out.push("<hr>"); i++; continue; }
    if (/^```/.test(l)) {
      i++; var code=[];
      while (i<ls.length && !/^```/.test(ls[i])) { code.push(ls[i]); i++; }
      i++; out.push("<pre><code>"+code.join("\n")+"</code></pre>"); continue;
    }
    if (/^&gt;\s?/.test(l)) {
      var q=[];
      while (i<ls.length && /^&gt;\s?/.test(ls[i])) { q.push(ls[i].replace(/^&gt;\s?/,"")); i++; }
      out.push("<blockquote>"+blocks(q)+"</blockquote>"); continue;
    }
    var ulR=/^\s*[-*+]\s+/, olR=/^\s*\d+[.)]\s+/;
    if (ulR.test(l)||olR.test(l)) {
      var ord=olR.test(l), items=[];
      while (i<ls.length && (ord?olR.test(ls[i]):ulR.test(ls[i]))) {
        items.push('<li dir="auto">'+inline(ls[i].replace(ord?/^\s*\d+[.)]\s+/:/^\s*[-*+]\s+/,""))+"</li>"); i++;
      }
      out.push((ord?"<ol>":"<ul>")+items.join("")+(ord?"</ol>":"</ul>")); continue;
    }
    var img = l.match(/^!\[([^\]]*)\]\(([^)\s]+)\)\s*$/);
    if (img) {
      var u=safeUrl(img[2]);
      if (u) { out.push('<figure><img src="'+u+'" alt="'+img[1]+'">'+
        (img[1]?"<figcaption>"+img[1]+"</figcaption>":"")+"</figure>"); i++; continue; }
    }
    var para=[l]; i++;
    while (i<ls.length && !isBlock(ls[i])) { para.push(ls[i]); i++; }
    out.push('<p dir="auto">'+inline(para.join("<br>"))+"</p>");
  }
  return out.join("\n");
}

function videoEmbed(url){

  var yt=u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{6,})/);
  if (yt) return '<div class="embed"><iframe src="https://www.youtube.com/embed/'+esc(yt[1])+
    '" title="Video" allow="accelerometer;autoplay;clipboard-write;encrypted-media;picture-in-picture" allowfullscreen loading="lazy"></iframe></div>';
  var vm=u.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if (vm) return '<div class="embed"><iframe src="https://player.vimeo.com/video/'+esc(vm[1])+
    '" title="Video" allow="fullscreen;picture-in-picture" allowfullscreen loading="lazy"></iframe></div>';
  if (/\.(mp4|webm|ogv|ogg|mov)(\?|$)/i.test(u)) {
    var s=safeUrl(u);
    return s?'<div class="embed"><video controls preload="metadata" src="'+esc(s)+'"></video></div>':"";
  }

}

/* ---------- 12. Render ---------- */
function render(){
  var r=route(), main=document.getElementById("main");
  document.documentElement.lang=S.lang;
  document.documentElement.dir=S.lang==="ar"?"rtl":"ltr";
  if (!S.ready) { main.innerHTML='<p class="loading">Opening the library…</p>'; return; }

  if (S.panel==="read" && (r.view==="desk"||r.view==="write"||r.view==="edit")) S.panel="scribe";

  var html;
  switch (r.view) {
    case "post": html=viewPost(decodeURIComponent(r.arg)); break;
    case "tag": html=viewHome(decodeURIComponent(r.arg),""); break;
    case "search": html=viewHome("",decodeURIComponent(r.arg)); break;
    case "archive": html=viewArchive(); break;
    case "about": html=viewAbout(); break;
    case "desk": html=viewDesk(); break;
    case "write": html=viewEditor(""); break;
    case "edit": html=viewEditor(r.arg); break;
    default: html=viewHome("",""); 
  }
  paintBackdrop();
  if (r.view!=="write" && r.view!=="edit") DRAFT=null;
  main.innerHTML=html;
  renderTop(); renderRail();
  var cur=r.view==="post"?findBySlug(decodeURIComponent(r.arg)):null;
  document.title=(cur?loc(cur,"title")+" — ":"")+loc(S.settings,"title");
  if (r.view==="write"||r.view==="edit") wireEditor();
  window.scrollTo(0,0);
}

/* ---------- 13. Persistence ---------- */
function saveSite(){ return store.set(K_SITE,{settings:S.settings,posts:S.posts},true); }
function saveSubs(){ return store.set(K_SUBS,S.subs,true); }
function savePref(){ return store.set(K_PREF,{lang:S.lang,panel:S.panel},false); }
async function load(){
  var res=await Promise.all([store.get(K_SITE,true),store.get(K_SUBS,true),store.get(K_PREF,false)]);
  var site=res[0], subs=res[1], pref=res[2];
  /* a published copy carries its library inside it; it seeds a reader who has
     nothing saved yet, and steps aside once there is anything of their own */
  if (!site || !Array.isArray(site.posts) || !site.posts.length) {
    var baked = bakedData();
    if (baked) site = { settings:baked.settings, posts:baked.posts };
  }
  if (site && typeof site==="object") {
    S.settings=Object.assign({},DEFAULTS,site.settings||{});
    S.settings.links=Object.assign({},DEFAULTS.links,(site.settings||{}).links||{});
    S.posts=Array.isArray(site.posts)?site.posts:[];
  }
  S.subs=Array.isArray(subs)?subs:[];
  if (pref && pref.lang) S.lang = pref.lang==="ar"?"ar":"en";
  if (pref && pref.panel) S.panel = pref.panel==="scribe"?"scribe":"read";
  S.ready=true;
  render();
}

/* ---------- 14. Editor wiring ---------- */
function wireEditor(){
  var form=document.getElementById("editor"); if(!form) return;
  var id=form.dataset.id;
  var draft=editorDraft(id);
  var sel=document.getElementById("f-type"), holder=document.getElementById("media-fields");
  holder.innerHTML=mediaFields(sel.value,draft);
  sel.addEventListener("change",function(){
    capture(form,draft);
    holder.innerHTML=mediaFields(sel.value,draft);
  });

  Array.prototype.forEach.call(form.querySelectorAll("[data-editlang]"),function(b){
    b.addEventListener("click",function(){
      capture(form,draft);
      S.editLang=b.dataset.editlang;
      render();
    });
  });

  document.getElementById("preview-toggle").addEventListener("click",function(){
    var pv=document.getElementById("preview"), body=document.getElementById("preview-body");
    if (pv.hidden) {
      var d=readForm(form), sfx=S.editLang==="ar"?"_ar":"";
      var title=d["title"+sfx]||"", txt=d["body"+sfx]||"";
      var media=d.type==="video"?videoEmbed(d.videoUrl):d.type==="photo"?galleryHtml(d.images,title):
        (safeUrl(d.cover)?'<div class="band"><img src="'+esc(safeUrl(d.cover))+'" alt=""></div>':"");
      var rc=rtlClass(title+" "+txt);
      body.innerHTML=media+'<article class="leaf'+rc+'"'+dirAttrs(title+" "+txt)+
        '><h1 dir="auto">'+esc(title||"—")+'</h1><div class="prose'+rc+'">'+md(txt)+'</div></article>';
      pv.hidden=false; this.textContent=t("hidePreview");
      pv.scrollIntoView({behavior:"smooth",block:"start"});
    } else { pv.hidden=true; this.textContent=t("preview"); }
  });

  var del=document.getElementById("del");
  if (del) del.addEventListener("click",async function(){
    if(!confirm(t("confirmDel"))) return;
    S.posts=S.posts.filter(function(p){return p.id!==id;});
    DRAFT=null;
    await saveSite(); toast(t("deleted")); go("#/desk");
  });

  form.addEventListener("submit",async function(ev){
    ev.preventDefault();
    var act=(ev.submitter&&ev.submitter.value)||"published";
    capture(form,draft);
    if (!draft.title && !draft.title_ar){ toast(t("titleFirst")); return; }
    draft.status=act==="draft"?"draft":"published";
    draft.updatedAt=new Date().toISOString();
    draft.slug=uniqueSlug(draft.title||draft.title_ar,draft.id);
    var post=commit(draft);
    if (await saveSite()) {
      DRAFT=null;
      toast(post.status==="published"?t("published2"):t("saved"));
      go("#/post/"+encodeURIComponent(post.slug));
    }
  });
}
/* copy the fields currently on screen into the working draft */
function capture(form,draft){
  var d=readForm(form), sfx=S.editLang==="ar"?"_ar":"";
  if (d["title"+sfx]!==undefined) draft["title"+sfx]=String(d["title"+sfx]).trim();
  if (d["body"+sfx]!==undefined) draft["body"+sfx]=d["body"+sfx];
  if (d.type!==undefined) draft.type=d.type;
  if (d.tags) draft.tags=d.tags;
  if (form.querySelector('[name="cover"]')) draft.cover=d.cover;
  if (form.querySelector('[name="images"]')) draft.images=d.images;
  if (form.querySelector('[name="videoUrl"]')) draft.videoUrl=d.videoUrl;
  if (d.date) draft.createdAt=new Date(d.date+"T12:00:00").toISOString();
  return draft;
}
/* fold the working draft into the library: replace by id, or append */
function commit(draft){
  var clean={};
  Object.keys(draft).forEach(function(k){ if (k!=="__for") clean[k]=draft[k]; });
  var at=-1;
  for (var i=0;i<S.posts.length;i++) if (S.posts[i].id===clean.id) { at=i; break; }
  if (at>-1) S.posts[at]=clean; else S.posts.push(clean);
  return clean;
}
function readForm(form){
  var g=function(n){ var el=form.querySelector('[name="'+n+'"]'); return el?el.value:undefined; };
  return {
    type:g("type"), title:g("title"), title_ar:g("title_ar"),
    body:g("body"), body_ar:g("body_ar"),
    cover:g("cover"), videoUrl:g("videoUrl"), images:lines(g("images")), date:g("date"),
    tags:String(g("tags")||"").split(",").map(function(s){return s.trim();}).filter(Boolean)
  };
}
function uniqueSlug(title,id){
  var base=slugify(title), s=base, n=2;
  while (S.posts.some(function(p){ return p.slug===s && p.id!==id; })) { s=base+"-"+n; n++; }
  return s;
}

/* ---------- 15a. Binding a published copy ---------- */
/* A hosted page has no server to ask for posts, so the posts travel inside the
   file itself. bakeSite() clones this very document, resets the parts the app
   fills in at run time, and staples the library into the head as JSON. The
   result is one file that shows the same posts to every visitor. */
function bakePayload(){
  /* "</" would end the script tag early; JSON reads "<\/" as "</" so this is safe */
  return JSON.stringify({ settings:S.settings, posts:S.posts, baked:new Date().toISOString() })
    .replace(/<\//g, "<\\/");
}
function bakedData(){
  var el = document.getElementById("baked");
  if (!el) return null;
  try { var d = JSON.parse(el.textContent||el.innerHTML); return d && d.posts ? d : null; }
  catch(e){ return null; }
}
/* github.io addresses are lower case and allow only letters, digits and hyphens */
function ghClean(u){ return String(u||"").trim().replace(/^@/,"").replace(/[^A-Za-z0-9-]/g,"").toLowerCase(); }
function ghRepo(u){ var c=ghClean(u); return c ? c+".github.io" : ""; }
function ghUrl(u){ var c=ghClean(u); return c ? "https://"+c+".github.io" : ""; }

function bakeSite(){
  var clone = document.documentElement.cloneNode(true);
  var q = function(sel){ return clone.querySelector(sel); };
  /* reset everything the app paints in at run time */
  var rail=q("#rail"); if (rail) rail.innerHTML="";
  var top=q("#topbar"); if (top) top.innerHTML="";
  var main=q("#main"); if (main) main.innerHTML='<p class="loading">Opening the library…</p>';
  var tSpan=q("#toast span"); if (tSpan) tSpan.textContent="";
  var lbImg=q("#lb-img"); if (lbImg) lbImg.removeAttribute("src");
  var lb=q("#lightbox"); if (lb) lb.setAttribute("class","lightbox");
  var paint=q("#painting"); if (paint) paint.removeAttribute("style");
  var ttl=q("title"); if (ttl) ttl.textContent = loc(S.settings,"title") || "Scriptorium";
  var prev=q("#baked"); if (prev && prev.parentNode) prev.parentNode.removeChild(prev);

  var script = document.createElement("script");
  script.id = "baked";
  script.type = "application/json";
  script.textContent = bakePayload();
  var head = q("head"); if (head) head.appendChild(script);
  return "<!DOCTYPE html>\n" + clone.outerHTML;
}

/* ---------- 15b. Letters ---------- */
/* If the author has pointed the form at a real mailing-list service, hand the
   address on to it. Cross-origin replies can't be read back, so this is
   best-effort: the address is always kept locally as well. */
async function forwardToList(email){
  var url=safeUrl(S.settings.listUrl);
  if (!url) return false;
  try{
    var fd=new FormData();
    fd.append(S.settings.listField||"email", email);
    await fetch(url,{method:"POST",mode:"no-cors",body:fd});
    return true;
  }catch(e){ return false; }
}
/* Build a letter for one post and hand it to the author's mail client with
   every subscriber in BCC. mailto: links have a length ceiling, so the
   register is sent out in batches. */
var BATCH=40;
function subBatches(){
  var out=[], all=S.subs.map(function(s){ return s.email; });
  for (var i=0;i<all.length;i+=BATCH) out.push(all.slice(i,i+BATCH));
  return out;
}
function letterFor(p){
  if (!p) return { subject:"", body:"" };
  var title=loc(p,"title")||"", url=postUrl(p);
  var body=stripMd(loc(p,"body")).slice(0,900);
  var tail=stripMd(loc(p,"body")).length>900 ? "…" : "";
  return { subject:title, body:title+"\n\n"+body+tail+"\n\n"+t("letterRead")+" "+url+"\n" };
}
function mailtoFor(p,batch){
  var L=letterFor(p);
  return "mailto:?bcc="+encodeURIComponent(batch.join(","))+
    "&subject="+encodeURIComponent(L.subject)+
    "&body="+encodeURIComponent(L.body);
}
